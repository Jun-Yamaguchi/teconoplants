# WordPress（HTTPS）
# 設置:
#   sudo certbot certonly --apache -d example.tecono.jp
#   sudo cp config/httpd/wordpress-le-ssl.conf /etc/httpd/conf.d/wordpress-le-ssl.conf
#   sudo httpd -t && sudo systemctl reload httpd

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName example.tecono.jp

    ErrorLog /var/log/httpd/wordpress_error.log
    CustomLog /var/log/httpd/wordpress_access.log combined

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    LimitRequestBody 0

    ProxyPass / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/

SSLCertificateFile /etc/letsencrypt/live/example.tecono.jp/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/example.tecono.jp/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
