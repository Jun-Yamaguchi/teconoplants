# WordPress（HTTP / certbot 検証用）
# 設置:
#   sudo cp config/httpd/wordpress.conf /etc/httpd/conf.d/wordpress.conf
#   sudo httpd -t && sudo systemctl reload httpd
#
# 本番ドメインに合わせて設定済み（teconoplants.1lp.jp）。

<VirtualHost *:80>
    ServerName teconoplants.1lp.jp

    ErrorLog /var/log/httpd/wordpress_error.log
    CustomLog /var/log/httpd/wordpress_access.log combined

    # Basic認証（本番保護用）
    # 事前に: sudo htpasswd -c /var/www/vhosts/tecono/.htpasswd tecono_admin
    <Location />
        AuthType Basic
        AuthName "Restricted"
        AuthUserFile /var/www/vhosts/tecono/.htpasswd
        Require valid-user
    </Location>

    # SSL 取得後に有効化（HTTPS へリダイレクト）
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/
</VirtualHost>
